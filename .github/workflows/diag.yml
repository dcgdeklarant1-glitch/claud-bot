name: diag
on:
  push:
    branches: [main]
    paths: [.github/workflows/diag.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - shell: bash {0}
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir out
          for u in \
            "http://cbu.uz/uz/arkhiv-kursov-valyut/json/USD/" \
            "https://cbu.uz/uz/arkhiv-kursov-valyut/json/USD/" \
            "https://r.jina.ai/https://cbu.uz/uz/arkhiv-kursov-valyut/json/USD/" \
            "https://api.allorigins.win/raw?url=https%3A%2F%2Fcbu.uz%2Fuz%2Farkhiv-kursov-valyut%2Fjson%2FUSD%2F" \
            "https://nbu.uz/uz/exchange-rates/json/" \
            "https://www.cbr-xml-daily.ru/daily_json.js"; do
            echo "== $u" >> out/diag.txt
            rm -f r.txt
            curl -s -m 20 -A "Mozilla/5.0" -o r.txt -w "HTTP %{http_code} %{time_total}s\n" "$u" >> out/diag.txt
            head -c 300 r.txt >> out/diag.txt; echo >> out/diag.txt
          done
          cd out && git init -q -b diag && git add diag.txt
          git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm diag
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" diag
